<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrated map showing the service area across Louisville, St. Matthews, and Jeffersontown">
  <!-- palette: ink #15110d, paper #f4efe6, brick #a72a1d, brass #b8923f, steel #8d8579, steel-light #d9d2c2 -->

  <!-- backdrop roads -->
  <path d="M-10 230 Q120 190 180 210 T400 160" fill="none" stroke="#d9d2c2" stroke-width="10"/>
  <path d="M60 -10 Q90 90 180 110 T340 300" fill="none" stroke="#d9d2c2" stroke-width="10"/>

  <!-- route between stops -->
  <path d="M110 190 Q170 130 210 130 T300 90" fill="none" stroke="#15110d" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>

  <!-- truck along the route -->
  <g transform="translate(196,150) rotate(-18)">
    <rect x="-20" y="-10" width="30" height="18" rx="2" fill="#15110d"/>
    <path d="M10 -10 h14 l8 9 v9 h-22Z" fill="#15110d"/>
    <rect x="12" y="-6" width="9" height="7" fill="#f4efe6"/>
    <circle cx="-10" cy="10" r="5" fill="#a72a1d"/>
    <circle cx="18" cy="10" r="5" fill="#a72a1d"/>
  </g>

  <!-- pin: Louisville (largest, home base) -->
  <g transform="translate(110,190)">
    <path d="M0 -46 a24 24 0 1 1 -0.1 0 Z M0-46 a24 24 0 0 1 24 24 q0 18-24 42 q-24-24-24-42 a24 24 0 0 1 24-24Z" fill="#a72a1d"/>
    <circle cx="0" cy="-22" r="9" fill="#f4efe6"/>
  </g>
  <text x="110" y="46" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5" fill="#15110d">LOUISVILLE</text>
  <text x="110" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="1" fill="#8d8579">HOME BASE</text>

  <!-- pin: St. Matthews -->
  <g transform="translate(240,116) scale(0.78)">
    <path d="M0-46 a24 24 0 0 1 24 24 q0 18-24 42 q-24-24-24-42 a24 24 0 0 1 24-24Z" fill="#15110d"/>
    <circle cx="0" cy="-22" r="9" fill="#f4efe6"/>
  </g>
  <text x="240" y="66" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5" fill="#15110d">ST. MATTHEWS</text>

  <!-- pin: Jeffersontown -->
  <g transform="translate(310,80) scale(0.78)">
    <path d="M0-46 a24 24 0 0 1 24 24 q0 18-24 42 q-24-24-24-42 a24 24 0 0 1 24-24Z" fill="#15110d"/>
    <circle cx="0" cy="-22" r="9" fill="#f4efe6"/>
  </g>
  <text x="310" y="30" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5" fill="#15110d">JEFFERSONTOWN</text>

  <!-- frame corner ticks, echoing the ticket motif -->
  <path d="M16 16 h20 M16 16 v20" stroke="#8d8579" stroke-width="2"/>
  <path d="M384 284 h-20 M384 284 v-20" stroke="#8d8579" stroke-width="2"/>
</svg>
